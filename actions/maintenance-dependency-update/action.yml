name: Maintenance Dependency Update
description: Runs Renovate to update repository dependencies
author: clavicarius

inputs:
  github-token:
    description: >-
      Token Renovate uses to access the repository and create pull requests
    required: true

runs:
  using: composite
  steps:
    - name: Run Renovate
      uses: renovatebot/github-action@v46.3.13
      with:
        token: ${{ inputs.github-token }}
