name: Repository Label Management
description: Synchronizes repository labels with a semicolon-delimited CSV
author: clavicarius

inputs:
  csv-file:
    description: Path to the semicolon-delimited label configuration
    required: false
    default: '.github/gh-labels.csv'
  github-token:
    description: Token with permission to manage repository labels
    required: true

runs:
  using: composite
  steps:
    - name: Synchronize labels
      shell: bash
      env:
        CSV_FILE: ${{ inputs.csv-file }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/create_labels.py" \
          --repo "$REPOSITORY" \
          --csv "$CSV_FILE" \
          --overwrite \
          --prune
