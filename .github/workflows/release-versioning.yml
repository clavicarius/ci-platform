name: Versioning

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: versioning-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changeset-check:
    name: Require Changeset for platform changes
    if: |
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for required Changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"

          implementation_changed=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|actions/*|\
                scripts/validate-version-tag.sh|scripts/validate-branch-name.sh|\
                scripts/validate-release-branch.sh|scripts/validate-tag-immutable.sh|\
                scripts/release-from-package-version.mjs)
                implementation_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          if [ "$implementation_changed" != true ]; then
            echo "No platform implementation changes require a Changeset."
            exit 0
          fi

          has_changeset=false
          while IFS= read -r file; do
            if [[ "$file" == .changeset/*.md &&
              "$file" != .changeset/README.md &&
              -f "$file" ]]; then
              has_changeset=true
              break
            fi
          done <<< "$changed_files"

          if [ "$has_changeset" != true ]; then
            echo "::error::Missing required Changeset in .changeset/."
            exit 1
          fi

  changesets:
    name: Create or publish Changesets version
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create version pull request or release
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version
          publish-script: npm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: 'false'
          push-git-tags: 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
