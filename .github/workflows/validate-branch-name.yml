name: Validate Branch Name

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.user.login, 'copilot')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate source branch name
        uses: ./actions/validate-branch-name
        with:
          branch-name: ${{ github.head_ref }}
          branch-regex: '^((feature|enhancement|bugfix|hotfix|release|chore|copilot)/[a-z0-9._-]+|changeset-release/main)$'
